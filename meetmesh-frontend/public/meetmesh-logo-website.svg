<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80" viewBox="0 0 320 80" role="img">
  <title>MeetMesh — website logo</title>
  <desc>MeetMesh horizontal lockup: hexagonal mesh icon alongside the MeetMesh wordmark, monochromatic black.</desc>

  <!-- Hexagonal mesh icon, scaled 1.25x, centered vertically at y=40 -->
  <!-- Icon geometry in 60x60 space; translate(5, 2.5) scale(1.25) places visual center at ~(45, 40) -->
  <g transform="translate(5, 2.5) scale(1.25)" stroke="#0f0f0f">
    <!-- Outer ring + spokes -->
    <g fill="none" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
      <line x1="51" y1="30" x2="41" y2="12"/>
      <line x1="41" y1="12" x2="20" y2="12"/>
      <line x1="20" y1="12" x2="9" y2="30"/>
      <line x1="9" y1="30" x2="20" y2="48"/>
      <line x1="20" y1="48" x2="41" y2="48"/>
      <line x1="41" y1="48" x2="51" y2="30"/>
      <line x1="30" y1="30" x2="51" y2="30"/>
      <line x1="30" y1="30" x2="41" y2="12"/>
      <line x1="30" y1="30" x2="20" y2="12"/>
      <line x1="30" y1="30" x2="9" y2="30"/>
      <line x1="30" y1="30" x2="20" y2="48"/>
      <line x1="30" y1="30" x2="41" y2="48"/>
    </g>
    <!-- Nodes -->
    <g fill="#0f0f0f">
      <circle cx="30" cy="30" r="4.5"/>
      <circle cx="51" cy="30" r="3.5"/>
      <circle cx="41" cy="12" r="3.5"/>
      <circle cx="20" cy="12" r="3.5"/>
      <circle cx="9"  cy="30" r="3.5"/>
      <circle cx="20" cy="48" r="3.5"/>
      <circle cx="41" cy="48" r="3.5"/>
    </g>
  </g>

  <!-- Wordmark: "Meet" regular + "Mesh" medium -->
  <text
    x="92" y="40"
    dominant-baseline="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="42"
    letter-spacing="0.4"
    fill="#0f0f0f">
    <tspan font-weight="400">Meet</tspan><tspan font-weight="500">Mesh</tspan>
  </text>
</svg>

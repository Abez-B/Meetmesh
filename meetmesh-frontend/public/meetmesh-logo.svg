<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img">
  <title>MeetMesh — app icon</title>
  <desc>MeetMesh app icon: white hexagonal mesh icon centered on a dark rounded square, monochromatic.</desc>

  <!-- Dark rounded square background -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#0f0f0f"/>

  <!-- Hexagonal mesh icon, scale(1.367), centered at (50, 50) -->
  <!-- T_x = 50 - 30*1.367 = 9, T_y = 9 -->
  <g transform="translate(9, 9) scale(1.367)" stroke="#ffffff">
    <g fill="none" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round">
      <line x1="51" y1="30" x2="41" y2="12"/>
      <line x1="41" y1="12" x2="20" y2="12"/>
      <line x1="20" y1="12" x2="9" y2="30"/>
      <line x1="9" y1="30" x2="20" y2="48"/>
      <line x1="20" y1="48" x2="41" y2="48"/>
      <line x1="41" y1="48" x2="51" y2="30"/>
      <line x1="30" y1="30" x2="51" y2="30"/>
      <line x1="30" y1="30" x2="41" y2="12"/>
      <line x1="30" y1="30" x2="20" y2="12"/>
      <line x1="30" y1="30" x2="9" y2="30"/>
      <line x1="30" y1="30" x2="20" y2="48"/>
      <line x1="30" y1="30" x2="41" y2="48"/>
    </g>
    <g fill="#ffffff">
      <circle cx="30" cy="30" r="4.5"/>
      <circle cx="51" cy="30" r="3.5"/>
      <circle cx="41" cy="12" r="3.5"/>
      <circle cx="20" cy="12" r="3.5"/>
      <circle cx="9"  cy="30" r="3.5"/>
      <circle cx="20" cy="48" r="3.5"/>
      <circle cx="41" cy="48" r="3.5"/>
    </g>
  </g>
</svg>

<!DOCTYPE html>
<html>
<head>
  <title>Button Test</title>
  <style>
    body {
      background: #1a1a1a;
      color: white;
      font-family: sans-serif;
      padding: 20px;
    }
    .test-container {
      position: relative;
      width: 100%;
      height: 400px;
      background: #2a2a2a;
      border: 2px solid #444;
    }
    .test-controls {
      position: absolute;
      right: 16px;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1000;
    }
    .test-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      pointer-events: auto;
    }
    .test-btn:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    .test-btn:active {
      background: rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body>
  <h1>Button Click Test</h1>
  <p>Open DevTools Console (F12) and click the buttons below:</p>
  
  <div class="test-container">
    <div class="test-controls">
      <button class="test-btn" id="btn-recenter">⊕</button>
      <button class="test-btn" id="btn-out">−</button>
      <button class="test-btn" id="btn-in">+</button>
    </div>
  </div>
  
  <script>
    document.getElementById('btn-recenter').addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      console.log('✅ RECENTER BUTTON CLICKED!');
      alert('Recenter button works!');
    });
    
    document.getElementById('btn-out').addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      console.log('✅ ZOOM OUT BUTTON CLICKED!');
      alert('Zoom out button works!');
    });
    
    document.getElementById('btn-in').addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      console.log('✅ ZOOM IN BUTTON CLICKED!');
      alert('Zoom in button works!');
    });
    
    console.log('Test page loaded. Buttons should be clickable.');
  </script>
</body>
</html>

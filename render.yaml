services:
  - type: web
    name: we-inai-relay
    env: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm -r --filter meetmesh-core --filter meetmesh-api run build
    startCommand: node meetmesh-api/dist/index.mjs
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: '*'
